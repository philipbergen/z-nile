# Which model runs each stage. Files stack like .gitignore: a .models.toml closer to the work replaces only
# the keys it sets. A role names what belongs to the stage (model, cli, runtime, rank, max_tokens, effort,
# pool, fallbacks, rotate). A fallback names what belongs to the model (its id, its runtime, and anything only
# that CLI needs). A member is a named extra model of a CLI (several models may run on one CLI). A try is the
# role's rank, cap and effort on that model. Nothing defaults.
# max_tokens counts input + cache writes + output (cache reads are left out); the step is killed when it passes it.
# A role's tries are its own model, the members its `pool` lists (in that order), then its `fallbacks`. Pool members and
# rotation are for review steps: a step that authors on the same role (z-raft on `raft`) tries the role's model, then its fallbacks.
# A role with rotate = true is ordered by family (the picker, reviewpool.luau): a review goes first to a model line that
# differs from the one that wrote the text and from the previous round's reviewer (tier 1), then to one that
# differs from the writer only (tier 2), and last to the writer's own line, the exact model that wrote it at the very
# end (tier 3: the flagged fallback, which never blocks the chain). `author` names the role whose first choice stands in
# for the writer when no spend row records it; no try is dropped for it.
# [families] maps a model line to its id prefixes (the longest prefix wins): add a line when a CLI brings new ids.
# design-challenge names no author: the table gives it the same model as design. Raft-mode review uses the raft role.

[families]
opus = ["claude-opus-"]
fable = ["claude-fable-"]
sonnet = ["claude-sonnet-"]
haiku = ["claude-haiku-"]
kimi = ["kimi-"]
grok = ["grok-"]
gemini = ["gemini-"] # reached through agy
gpt = ["gpt-"] # agy's GPT-OSS
# opencode's models are recorded as opencode-<provider>-<model>, each provider its own line: none is ever the model line of
# the same model reached another way (opencode-xai-grok-4.7 is not the grok line), and none is a review kind
opencode-deepseek = ["opencode-deepseek-"]
opencode-xai = ["opencode-xai-"]
opencode-opencode = ["opencode-opencode-"] # opencode's own (Zen) free models

[dispatch]
# the merge gates the dispatcher passes itself when the PR is green and mergeable; the run's PR is always a human's.
# Unset, or unreadable, means none: a closer file's `auto_merge = []` turns them off for its items.
auto_merge = ["prep", "raft"]
# a step that prints nothing for this long is killed (a CLI never waits for quota)
stall_seconds = 300
# the same limit while a tool call runs (a full gate is quiet for minutes)
tool_seconds = 900

[fallback.kimi]
model = "kimi-code-k3.1-pro"
runtime = "kimi-cli"

[fallback.grok]
model = "grok-4.7"
runtime = "grok-cli"

# agy (Google Antigravity) carries Gemini, Claude and GPT-OSS models, by their bare names; an effort it does not offer for the
# model (Opus tops out at high) is lowered to the highest it does (models.effortFor), so the spend row records what ran.
[fallback.agy]
model = "claude-opus-5-5"
runtime = "agy-cli"

# opencode reaches DeepSeek (and the free Zen models, xai) under the credentials this machine holds. It authors and reviews
# a stream; it never passes a review kind (c0306), so no review role names it.
[fallback.opencode]
model = "opencode-deepseek-deepseek-v4-pro"
runtime = "opencode-cli"

[fallback.agent]
model = "claude-opus-5-5"
runtime = "cursor-cli"
# agent reports no running token count: its step stops after max_calls model calls (calls are not tokens: tune it)
max_calls = 200
# and a wall-time ceiling, since a stream can hide its calls (fail closed)
max_minutes = 240

# a second Claude model on the same CLI, tried after a role's own model and before its fallbacks
[member.fable]
cli = "claude"
model = "claude-fable-5-2"
runtime = "claude-cli"

[member.opus]
cli = "claude"
model = "claude-opus-5-5"
runtime = "claude-cli"

# the cheap second model of a stream review (a Haiku-written layer is reviewed by Sonnet)
[member.sonnet]
cli = "claude"
model = "claude-sonnet-5-5"
runtime = "claude-cli"

# cheap second models of a stream review, on lines other than the Sonnet that writes the code
[member.gemini-flash]
cli = "agy"
model = "gemini-3.8-flash"
runtime = "agy-cli"

[member.deepseek-flash]
cli = "opencode"
model = "opencode-deepseek-deepseek-flash"
runtime = "opencode-cli"

[roles.idea]
model = "claude-fable-5-2"
cli = "claude"
runtime = "claude-cli"
rank = 2
max_tokens = 300000
effort = "medium"
fallbacks = ["kimi", "grok", "agent", "agy", "opencode"]

[roles.idea-challenge]
model = "claude-opus-5-5"
cli = "claude"
runtime = "claude-cli"
rank = 4
max_tokens = 300000
effort = "xhigh"
author = "idea"
rotate = true
fallbacks = ["kimi", "grok", "agent", "agy"]

[roles.design]
model = "claude-opus-5-5"
cli = "claude"
runtime = "claude-cli"
rank = 4
max_tokens = 3000000
effort = "high"
fallbacks = ["kimi", "grok", "agent", "agy", "opencode"]

[roles.design-challenge]
model = "claude-opus-5-5"
cli = "claude"
runtime = "claude-cli"
rank = 4
max_tokens = 3000000
effort = "xhigh"
rotate = true
pool = ["fable"]
fallbacks = ["kimi", "grok", "agent", "agy"]

[roles.raft]
model = "claude-opus-5-5"
cli = "claude"
runtime = "claude-cli"
rank = 3
max_tokens = 3000000
effort = "high"
rotate = true
pool = ["fable"]
fallbacks = ["kimi", "grok", "agent", "agy"]

[roles.implementation]
model = "claude-sonnet-5-5"
cli = "claude"
runtime = "claude-cli"
rank = 3
max_tokens = 12000000
effort = "high"
fallbacks = ["kimi", "grok", "agent", "agy", "opencode"]

[roles.code-review]
model = "claude-opus-5-5"
cli = "claude"
runtime = "claude-cli"
rank = 4
max_tokens = 2000000
effort = "xhigh"
author = "implementation"
rotate = true
pool = ["fable"]
fallbacks = ["kimi", "grok", "agent", "agy"]

[roles.final-review]
model = "claude-fable-5-2"
cli = "claude"
runtime = "claude-cli"
rank = 4
max_tokens = 2000000
effort = "xhigh"
rotate = true
pool = ["opus"]
fallbacks = ["kimi", "grok", "agent", "agy"]

# the one cheap review: a stream review of a layer, on a model line other than the Sonnet that writes the code. Its other
# models are the cheap Sonnet, Gemini flash (agy) and DeepSeek flash (opencode) members (kimi and grok are not cheap); opencode's
# stronger DeepSeek is the last fallback. A stream review is not held to the review kinds (c0306).
[roles.stream-review]
model = "claude-haiku-5-5"
cli = "claude"
runtime = "claude-cli"
rank = 2
max_tokens = 1000000
effort = "medium"
rotate = true
pool = ["sonnet", "gemini-flash", "deepseek-flash"]
fallbacks = ["opencode"]
