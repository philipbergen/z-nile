# the walkthrough of ./zn approve (f0423): the CLI the command starts interactively on the owner's terminal. It is not
# a dispatched step, so it has no fallbacks: the command refuses a CLI it cannot start interactively.
[roles.approve]
model = "claude-opus-5-5"
cli = "claude"
runtime = "claude-cli"
rank = 4
max_tokens = 3000000
effort = "high"

# The new shape (f0421 slice 2, step 8), beside the legacy tables above until step 9 removes them. Each CLI defines the aliases
# it can deliver: a partial list is valid (grok takes only light, agent and kimi only heavy, agy all four), and `./zn work next` never hands a
# CLI an activity whose alias it lacks (it waits, and `./zn model` exits 1). Each activity names, per risk level, the alias it
# needs. This is an editable list, not a rule: change the aliases, or add a CLI, here or in a closer file.
[clis.claude]
xlight = { model = "claude-haiku-5-5", effort = "low" }
light = { model = "claude-sonnet-5-5", effort = "medium" }
heavy = { model = "claude-opus-5-5", effort = "high" }
ultra = { model = "claude-fable-5-2", effort = "xhigh", context = 1000000 }
[clis.grok]
light = { model = "grok-4.7", effort = "high" }
[clis.agent]
heavy = { model = "claude-opus-5-5", effort = "high" }
max_calls = 200
max_minutes = 240
[clis.kimi]
heavy = { model = "kimi-code-k3.1-pro" }
# agy (Antigravity) writes with Gemini 4 Neon, reviews with Gemini 4 Argon (owner, 2026-11-24), runs ultra on Gemini 4 Carbon
# (owner, 2026-11-26), and runs every Gemini model at medium effort (owner, 2026-11-27): its ids carry the effort, so none is set.
# A CLI may add a `review` sub-table of the same aliases: design-review, raft-review, code-review, final-review and idea-challenge
# take an alias from it when it defines that alias (else the plain one), and every other activity ignores it. A closer file's
# `review` table merges per alias, as the plain aliases do. `[clis.agy.review]` sets light and heavy, so ultra reviews (idea-challenge,
# final-review and the reviews of risky tickets) resolve `[clis.agy]`'s ultra (`gemini-4-carbon-medium`). agy runs several models and a
# session runs one: it names its own in ZN_MODEL.
# A review on another
# model than the one that wrote the text is preferred, but its own model is allowed (owner, 2026-11-24): `./zn model <review> --for
# <id>` says `same-model=yes` when it happens, and the review's record carries it.
[clis.agy]
xlight = { model = "gemini-4-neon-medium" }
light = { model = "gemini-4-neon-medium" }
heavy = { model = "gemini-4-neon-medium" }
ultra = { model = "gemini-4-carbon-medium" }
[clis.agy.review]
light = { model = "gemini-4-argon-medium" }
heavy = { model = "gemini-4-argon-medium" }

