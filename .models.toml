# Which model runs each stage. Files stack like .gitignore: a .models.toml closer to the work replaces only
# the keys it sets. A role names what belongs to the stage (model, cli, runtime, rank, max_tokens, effort,
# fallbacks). A fallback names what belongs to the model (its id, its runtime, and anything only that CLI
# needs). A try is the role's rank, cap and effort on that model. Nothing defaults.
# max_tokens counts input + cache writes + output (cache reads are left out); the step is killed when it passes it.
# design-challenge names no author: the table gives it the same model as design, and naming the author would
# drop that model. Raft-mode review uses the raft role for the same reason.

[dispatch]
# the merge gate the dispatcher passes itself when the PR is green and mergeable: the rafting PR. The prep PR (a human
# approves the design with ./zn approve) and the run's PR are always a human's; "prep" is still accepted here, with no effect.
# Unset, or unreadable, means none: a closer file's `auto_merge = []` turns them off for its items.
auto_merge = ["raft"]
# a step that prints nothing for this long is killed (a CLI never waits for quota)
stall_seconds = 300
# the same limit while a tool call runs (a full gate is quiet for minutes)
tool_seconds = 900

[fallback.kimi]
model = "kimi-code-k3.1-pro"
runtime = "kimi-cli"

[fallback.grok]
model = "grok-4.7"
runtime = "grok-cli"

[fallback.agent]
model = "claude-opus-5-5"
runtime = "cursor-cli"
# agent reports no running token count: its step stops after max_calls model calls (calls are not tokens: tune it)
max_calls = 200
# and a wall-time ceiling, since a stream can hide its calls (fail closed)
max_minutes = 240

[roles.idea]
model = "claude-fable-5-2"
cli = "claude"
runtime = "claude-cli"
rank = 2
max_tokens = 300000
effort = "medium"
fallbacks = ["kimi", "grok", "agent"]

