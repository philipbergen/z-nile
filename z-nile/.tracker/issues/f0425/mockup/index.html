<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>z-nile app mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Colour tokens: the philip-bergen.com "gold-e" scheme. Light is the default (whatever the OS says); [data-theme="dark"] is the warm dark.
   Status and series colours stay bright; only the old purple/indigo is gone (waiting is lime, series 1 is cobalt).
   Contrast (WCAG, checked by script): text and text-2 >= 4.5 on bg, surfaces and tint; every status colour >= 4.5 on its chip,
   on bg and on surfaces; chart segments >= 3 on the surface and their in-segment text >= 4.5; --line-ui and --focus >= 3. */
:root{
  --bg:#f8f7f4; --surface:#ffffff; --surface-2:#f4f1e8; --surface-3:#ece8dc; --line:#e3e0d6; --line-soft:#ece9e0; --line-ui:#8a7f70;
  --text:#2c2723; --text-2:#6e655a; --accent:#7a5a18; --accent-strong:#f4d98e; --on-accent:#2c2723; --tint:#f8efd6; --tint-line:#a97f26;
  --focus:#7a5a18; --shadow:0 10px 30px rgba(44,39,35,.16); --scrim:rgba(44,39,35,.45);
  --easy:#0b6b62; --easy-bg:#d5f5ef; --normal:#7a4a00; --normal-bg:#fbefc6; --risky:#b4123a; --risky-bg:#fde0e6;
  --wait:#4d6b00; --wait-bg:#eef5c8; --ok:#146c34; --ok-bg:#d9f6e2; --back:#9a3705; --back-bg:#ffe6d3; --land:#075985; --land-bg:#d9efff;
  --s1:#2c4fd1; --s2:#0a7d70; --s3:#a16207; --s4:#c2255c; --s5:#0369a1; --s6:#15803d; --on-s:#ffffff;
  --gold-2:#d4a550;
  --term-bg:#241f1b; --term-ink:#f8f7f4; --term-warn:#e6b860; --term-ok:#f4d98e; --term-head:#2c2723; --term-line:#55493f; --term-dim:#cfc6ba;
  --sketch-paper:#f7f1e3; --sketch-ink:#2b2a33;
  --display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sans:"Geist",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#241f1b; --surface:#2c2723; --surface-2:#3a332e; --surface-3:#4a4038; --line:#55493f; --line-soft:#3a332e; --line-ui:#8a7c6c;
  --text:#fdfcfa; --text-2:#cfc6ba; --accent:#f4d98e; --accent-strong:#f4d98e; --on-accent:#2c2723; --tint:#3a332e; --tint-line:#d4a550;
  --focus:#f4d98e; --shadow:0 10px 30px rgba(0,0,0,.45); --scrim:rgba(20,16,13,.66);
  --easy:#5eead4; --easy-bg:#0f3438; --normal:#fcd34d; --normal-bg:#372d10; --risky:#fda4af; --risky-bg:#41202b;
  --wait:#bef264; --wait-bg:#2f3a0e; --ok:#86efac; --ok-bg:#123824; --back:#fdba74; --back-bg:#412912; --land:#7dd3fc; --land-bg:#11314a;
  --s1:#8fa8ff; --s2:#5eead4; --s3:#fcd34d; --s4:#fda4af; --s5:#7dd3fc; --s6:#86efac; --on-s:#241f1b;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.muted{color:var(--text-2)}

/* app frame */
.app{display:grid;grid-template-columns:72px minmax(0,1fr);grid-template-rows:64px minmax(0,1fr);height:100vh}
.rail{grid-row:1/3;background:var(--surface);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent-strong),var(--gold-2));color:var(--on-accent);margin-bottom:10px}
.logo .ic{width:22px;height:22px}
.navb{position:relative;width:60px;padding:8px 0 6px;border:0;border-radius:12px;background:transparent;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600}
.navb:hover{background:var(--surface-2);color:var(--text)}
.navb[aria-current="page"]{background:var(--tint);color:var(--text)}
.navb[aria-current="page"] .ic{color:var(--accent)}
.navb .ic{width:22px;height:22px}
.badge{position:absolute;top:2px;right:6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--accent-strong);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center}
.top{display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line-soft);background:var(--surface);min-width:0}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;white-space:nowrap}
.brand .repo{font-family:var(--mono);font-size:15px}
.brand .here{color:var(--text-2);font-weight:600}
.tribs{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding:6px 2px;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.tchip{flex:none;border:1px solid var(--line-ui);background:transparent;color:var(--text-2);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.tchip:hover{color:var(--text);border-color:var(--accent)}
.tchip[aria-pressed="true"]{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--on-accent)}
.tchip .n{opacity:.85;margin-left:4px;font-weight:500}
.live{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.live:hover{border-color:var(--ok)}
.live .lbl2{display:none}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:beat 2.4s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 8px color-mix(in srgb,var(--ok) 0%,transparent)}100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 0%,transparent)}}
.icon-btn{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line-ui);background:transparent;display:grid;place-items:center;color:var(--text)}
.icon-btn:hover{background:var(--surface-2)}
.ctl{position:relative;flex:none}
.ctl-menu{position:absolute;right:0;top:44px;z-index:60;width:270px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px}
.ctl-menu h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-2);padding:6px 10px}
.ctl-menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:9px;font-weight:600}
.ctl-menu button:hover{background:var(--surface-2)}
.ctl-menu button small{display:block;font-weight:400;color:var(--text-2)}

/* views */
.view{min-height:0;display:grid;grid-template-columns:330px minmax(0,1fr) 340px}
.view.chat-off{grid-template-columns:330px minmax(0,1fr) 0}
.view.v-other{display:block;overflow:auto}
.queue{min-height:0;overflow:auto;border-right:1px solid var(--line-soft);background:var(--bg);padding:20px 16px 60px}
.main{min-height:0;overflow:auto;display:flex;flex-direction:column;background:var(--bg)}
.content{flex:1 0 auto;padding:22px 36px 36px;max-width:980px;width:100%;margin:0 auto}
.chat{min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--line-soft);background:var(--surface);overflow:hidden}
.chat-off .chat{display:none}
.scrim{position:fixed;inset:64px 0 0 0;background:var(--scrim);z-index:25}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px 2px 8px;font-size:12.5px;font-weight:700;white-space:nowrap;line-height:1.6}
.chip .ic{width:14px;height:14px;vertical-align:0}
.c-easy{color:var(--easy);background:var(--easy-bg)} .c-normal{color:var(--normal);background:var(--normal-bg)} .c-risky{color:var(--risky);background:var(--risky-bg)}
.c-wait{color:var(--wait);background:var(--wait-bg)} .c-ok{color:var(--ok);background:var(--ok-bg)} .c-back{color:var(--back);background:var(--back-bg)} .c-land{color:var(--land);background:var(--land-bg)}
.c-trib{color:var(--text);background:var(--surface-2);border:1px solid var(--line);font-weight:600}

/* queue */
.qhead h2{font-size:20px;letter-spacing:-.01em}
.sum{margin-top:6px;font-size:14.5px;color:var(--text)}
.sum strong{color:var(--accent)}
.hint{margin-top:8px;font-size:12.5px;color:var(--text-2)}
kbd{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface-2);color:var(--text)}
.filter-note{margin-top:10px;font-size:13px;color:var(--text-2)}
.stack{margin-top:18px;background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:12px 12px 6px;transition:opacity .4s,transform .4s,max-height .45s;max-height:3000px;overflow:hidden}
.stack.collapsing{opacity:0;transform:scale(.97);max-height:0;padding-top:0;padding-bottom:0;margin-top:0}
.stack-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;padding:0 4px 8px}
.stack-h .stack-name{display:flex;gap:6px;align-items:center}
.stack-h .stack-meta{color:var(--text-2);font-weight:600}
.chain{list-style:none;margin:0;padding:0;position:relative}
.raft{position:relative;padding-left:22px;padding-bottom:6px}
.raft::before{content:"";position:absolute;left:8px;top:18px;bottom:-4px;width:2px;background:var(--line)}
.raft:last-child::before{display:none}
.raft-h{display:flex;align-items:baseline;gap:7px;font-size:13px;font-weight:700;padding:4px 0 6px;flex-wrap:wrap}
.node{position:absolute;left:0;top:6px;width:18px;height:18px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);display:grid;place-items:center}
.node.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.node .ic{width:11px;height:11px;stroke-width:3}
.raft-t{font-weight:600}
.raft-on{margin-left:auto;font-size:12px;color:var(--text-2);font-weight:600}
.trow{display:block;width:100%;text-align:left;border:1px solid transparent;background:var(--surface-2);border-radius:12px;padding:10px 12px;margin:0 0 6px;transition:background .15s,border-color .15s,transform .35s,opacity .35s}
.trow:hover{border-color:var(--line)}
.trow.sel{border-color:var(--accent);background:var(--tint);box-shadow:inset 3px 0 0 var(--accent)}
.trow.leaving{opacity:0;transform:translateX(40px)}
.trow > span{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.trow .r1{justify-content:space-between}
.trow .tid{font-weight:700}
.trow .r2{font-weight:650;margin-top:2px;line-height:1.35}
.trow .r3{margin-top:5px;font-size:13px;color:var(--text)}
.trow .r4{margin-top:4px;font-size:12.5px;color:var(--text-2);gap:4px 12px}
.trow .ontop{color:var(--accent);font-weight:700}
.trow .why{display:inline-flex;gap:5px;align-items:center}
.trow .why .ic{width:15px;height:15px;color:var(--wait)}
.trow.st-approved{background:var(--surface)}
.land-banner{background:var(--ok-bg);color:var(--text);border:1px solid var(--ok);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:13.5px}
.land-banner strong{color:var(--ok)}
.land-row{list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 0;padding:0}
.lr{display:flex;flex-direction:column;align-items:center;padding:5px 9px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:700;min-width:70px}
.lr span:last-child{font-weight:600;color:var(--text-2)}
.lr.merging{border-color:var(--land);animation:glow 1s ease-in-out infinite alternate}
.lr.merging span:last-child{color:var(--land)}
.lr.merged{border-color:var(--ok)} .lr.merged span:last-child{color:var(--ok)}
.lr-sep{color:var(--text-2);font-weight:700}
@keyframes glow{from{box-shadow:0 0 0 0 transparent}to{box-shadow:0 0 0 4px var(--land-bg)}}
.qsec{margin-top:26px}
.qsec h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-2);margin-bottom:8px}
.rw{list-style:none;margin:0;padding:0}
.rw li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:13.5px;animation:settle .45s ease-out}
.avatar{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--back-bg);color:var(--back);border:2px solid var(--back);position:relative}
.avatar.pick::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--back);opacity:0;animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{opacity:.8;transform:scale(.8)}100%{opacity:0;transform:scale(1.25)}}
.rw .w{color:var(--text-2)}
.bar{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:35%;background:var(--back);border-radius:3px;animation:slide 1.8s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.landed li{display:flex;gap:10px;align-items:center;background:transparent;border:1px dashed var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px;font-size:13.5px;list-style:none}
.landed ul{margin:0;padding:0}
.landed .ic{color:var(--ok)}

/* walkthrough */
.w-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);font-weight:600;flex-wrap:wrap}
.crumbs .sep{opacity:.7}
.w-top .spacer{flex:1}
.qbtn{display:none}
.w-title{font-size:30px;line-height:1.2;letter-spacing:-.02em;font-weight:800}
.w-title .mono{color:var(--accent);font-size:.75em;margin-right:6px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.callout{margin-top:14px;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--wait);background:var(--wait-bg);border-radius:12px;padding:10px 14px;font-size:14px}
.callout .ic{color:var(--wait);margin-top:2px}
.sec{margin-top:30px}
.sec > h2,.g-head h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:800;margin-bottom:10px}
.lead{font-size:17px;line-height:1.6;max-width:68ch}
.problem{margin-top:16px;background:var(--tint);border:1px solid var(--tint-line);border-radius:14px;padding:16px 18px}
.problem h3{font-size:15px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.problem h3 .ic{color:var(--accent)}
.asked{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
blockquote{margin:0;background:var(--surface);border-left:4px solid var(--accent);border-radius:4px 14px 14px 4px;padding:14px 18px;font-size:16.5px;line-height:1.55}
blockquote footer{margin-top:8px;font-size:13px;color:var(--text-2)}
.readbox{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px;font-size:14.5px}
.readbox h3{font-size:14px;margin-bottom:6px}
.pic{display:grid;gap:10px}
.thumb{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px;display:grid;gap:6px;text-align:left;font-size:13px;font-weight:600;color:var(--text-2)}
.thumb:hover{border-color:var(--accent)}
.thumb svg{width:100%;height:auto;border-radius:9px;display:block}
.mock-strip{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:14px}
.mock-strip p{margin:4px 0 12px;color:var(--text-2)}
.mframe{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.mframe svg{display:block;width:100%;height:auto}
.outs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.outs li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px}
.outs .ic{color:var(--ok);margin-top:3px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:14px 0 0}
.facts div{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:10px 14px}
.facts dt{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-2);font-weight:700}
.facts dd{margin:3px 0 0;font-weight:650}

/* guesses */
.g-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.g-head p{color:var(--text-2);font-size:14px}
.gprog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.gcount{font-weight:800;font-size:15px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:12px;font-weight:800;display:grid;place-items:center;padding:0;color:var(--text-2)}
.dot .ic{width:14px;height:14px;stroke-width:3}
.dot.d-fine{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.dot.d-change{background:var(--back-bg);border-color:var(--back);color:var(--back)}
.dot.cur{outline:2px solid var(--accent);outline-offset:2px}
.gnav{margin-left:auto;display:flex;gap:6px}
.gcard{background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow)}
.gcard.settle{animation:settle .4s ease-out}
@keyframes settle{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.gc-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gc-h h3{font-size:21px;letter-spacing:-.01em;margin-right:auto}
.gfacts{display:grid;gap:12px;margin:16px 0 0}
.gfacts div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px}
.gfacts dt{font-size:13px;font-weight:700;color:var(--text-2);padding-top:2px}
.gfacts dd{margin:0;font-size:15.5px}
.example{margin-top:16px;background:var(--tint);border:1px solid var(--tint-line);border-radius:14px;padding:14px 16px}
.example h4{font-size:14px;display:flex;gap:7px;align-items:center;margin-bottom:5px}
.example h4 .ic{color:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:16px}
.opt{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.opt.chosen{border:2px solid var(--accent)}
.opt-tag{align-self:flex-start;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;display:flex;gap:5px;align-items:center;color:var(--text-2)}
.opt.chosen .opt-tag{color:var(--accent)}
.opt h4{font-size:16px;line-height:1.35}
.opt h5{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-2);margin:2px 0 3px}
.opt ul{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:14.5px}
.opt li{display:flex;gap:7px;align-items:flex-start}
.opt li .ic{width:15px;height:15px;margin-top:3px}
.pros .ic{color:var(--ok)} .cons .ic{color:var(--risky)}
.you{font-size:14.5px;border-top:1px solid var(--line);padding-top:8px;margin-top:auto}
.costline{margin-top:14px;display:flex;gap:8px;align-items:flex-start;font-size:14.5px;font-weight:600}
.costline .ic{color:var(--back);margin-top:2px}
.rsum{margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14.5px;border-radius:12px;padding:9px 12px}
.rsum.ok{background:var(--ok-bg)} .rsum.ok > .ic{color:var(--ok)}
.rsum.back{background:var(--back-bg)} .rsum.back > .ic{color:var(--back)}
.gacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:11px;padding:9px 15px;font-weight:700;font-size:14.5px;transition:transform .1s,background .15s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{cursor:not-allowed;opacity:.55}
.btn.primary{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--on-accent)}
.btn.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.btn.warn{background:var(--back-bg);border-color:var(--back);color:var(--back)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.cform{margin-top:16px;border:1px solid var(--back);border-radius:14px;padding:16px;background:var(--surface-2);display:grid;gap:14px;animation:settle .3s ease-out}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px}
legend{font-weight:800;margin-bottom:6px}
.radio{display:flex;gap:9px;align-items:flex-start;font-size:15px}
.radio input{margin-top:5px;accent-color:var(--accent-strong)}
textarea,input[type=text]{width:100%;background:var(--surface);border:1px solid var(--line-ui);border-radius:10px;padding:9px 11px;resize:vertical}
.stages{display:flex;gap:8px;flex-wrap:wrap}
.stage{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-weight:700;background:var(--surface)}
.stage.on{border-color:var(--back);background:var(--back-bg);color:var(--back)}
.stage .pre{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2)}
.stage.on .pre{color:var(--back)}
.stage input{accent-color:var(--accent-strong)}
.field{display:grid;gap:5px;font-weight:700;font-size:14px}
.factions{display:flex;gap:10px}

/* ruling bar */
.rbar{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 36px;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.18)}
.tally{display:flex;gap:14px;flex-wrap:wrap;font-weight:700;font-size:14px}
.tl{display:flex;gap:6px;align-items:center}
.tl.ok .ic{color:var(--ok)} .tl.back .ic{color:var(--back)} .tl.none .ic{color:var(--wait)}
.rb-act{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sbinfo{font-size:13.5px;max-width:300px}
.rb-done{font-weight:700;display:flex;gap:8px;align-items:center}

/* chat */
.ch-h{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 18px 10px;border-bottom:1px solid var(--line-soft)}
.ch-h h2{font-size:17px}
.model{font-size:12.5px;color:var(--text-2);display:flex;gap:5px;align-items:center;margin-top:2px}
.model .ic{width:14px;height:14px;color:var(--accent)}
.ch-about{padding:10px 18px;font-size:13.5px;font-weight:650;background:var(--surface-2);border-bottom:1px solid var(--line-soft)}
.msgs{flex:1;min-height:0;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;border-radius:14px;padding:9px 13px;font-size:14.5px;animation:settle .3s ease-out}
.msg .who{display:block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px;color:var(--text-2)}
.msg.you{align-self:flex-end;background:var(--accent-strong);color:var(--on-accent);border-bottom-right-radius:4px}
.msg.you .who{color:var(--on-accent)}
.msg.agent{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line-soft);border-bottom-left-radius:4px}
.mocked{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:700;color:var(--back);background:var(--back-bg);border-radius:6px;padding:0 6px}
.composer{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 14px;border-top:1px solid var(--line-soft);align-items:end}

/* modal, toast, tag */
.modal-wrap{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:80;padding:16px;animation:fade .2s}
.modal-wrap[hidden]{display:none}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px 26px;animation:settle .3s ease-out}
.modal.wide{width:min(900px,100%)}
.modal h2{font-size:22px;letter-spacing:-.01em;margin-bottom:12px}
.modal h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:18px 0 8px}
.modal p{margin:6px 0}
.confirm p{display:flex;gap:8px;align-items:flex-start}
.confirm .ic{color:var(--ok);margin-top:2px}
.clist{margin:4px 0 8px;padding-left:22px;max-height:220px;overflow:auto;font-size:14.5px}
.clist li{margin:3px 0}
.clist span{color:var(--text-2)}
.mactions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.sb-item,.lesson{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:grid;gap:8px;background:var(--surface-2)}
.sb-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700}
.lesson.off{background:transparent;border-style:dashed}
.big svg{width:100%;height:auto;border-radius:12px;display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toasts{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:90;display:grid;gap:8px;width:min(520px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--text);color:var(--bg);border-radius:14px;padding:12px 16px;font-weight:650;box-shadow:var(--shadow);animation:settle .35s ease-out}
.toast .ic{margin-top:2px}
.mock-tag{position:fixed;left:8px;bottom:8px;z-index:70;pointer-events:none;background:var(--back-bg);color:var(--back);border:1px solid var(--back);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:800}

/* empty and placeholders */
.empty,.ph{max-width:720px;margin:0 auto;padding:60px 32px;text-align:center}
.empty h1,.ph h1{font-size:30px;letter-spacing:-.02em;margin-top:18px}
.empty p,.ph p{margin-top:10px;font-size:17px;color:var(--text-2)}
.empty svg.river{width:240px;height:auto}
.wk{list-style:none;padding:0;margin:28px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;text-align:left}
.wk li{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:12px 14px;font-size:14px}
.wk .nm{display:flex;gap:7px;align-items:center;font-weight:800}
.wk .nm i{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
.wk .tiers{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.ph .soon{display:inline-block;margin-top:14px;font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--wait);background:var(--wait-bg);border-radius:999px;padding:3px 12px}
.ph ul{text-align:left;margin:26px auto 0;max-width:520px;display:grid;gap:8px;padding:0;list-style:none}
.ph ul li{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:10px 14px}
.ph ul li b{display:block}
.ph > .ic{width:44px;height:44px;color:var(--accent)}
.pick{padding:80px 32px;text-align:center;color:var(--text-2);font-size:17px}

/* sketch and wireframe drawing classes */
.sk-paper{fill:var(--sketch-paper)} .sk-ink{fill:none;stroke:var(--sketch-ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sk-txt{fill:var(--sketch-ink);font:600 15px "Comic Sans MS","Chalkboard SE","Marker Felt",cursive}
.sk-c1{fill:#f7a8c4} .sk-c2{fill:#9fd8ff} .sk-c3{fill:#c7f0a8} .sk-c4{fill:#ffd88a}
.wf-bg{fill:var(--surface)} .wf-band{fill:var(--surface-2);stroke:var(--line);stroke-width:1.5} .wf-txt{fill:var(--text);font:700 13px var(--sans)} .wf-sub{fill:var(--text-2);font:600 11px var(--sans)}
.wf-a{fill:var(--accent-strong)} .wf-e{fill:var(--easy)} .wf-n{fill:var(--normal)} .wf-r{fill:var(--risky)} .wf-l{fill:var(--land)} .wf-line{fill:var(--line)}


/* ===== app shell additions: later entries, pages, Workers and Stats ===== */
.rail{overflow-y:auto;overflow-x:hidden}
.rail-sep{flex:none;width:36px;height:1px;background:var(--line);margin:6px 0}
.navb.later{border:1px dashed var(--line);color:var(--text-2);cursor:not-allowed}
.navb.later:hover{background:transparent;color:var(--text-2)}
.navb .tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2)}
.navb:disabled{opacity:1}

.v-other{overflow-x:hidden}
.page{padding:20px 28px 70px;max-width:1560px;margin:0 auto;min-width:0}
.pg-h{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.pg-t{min-width:0}
.pg-t h1{font-size:30px;letter-spacing:-.02em;font-weight:800;line-height:1.2}
.pg-t p{margin-top:4px;font-size:15px;max-width:70ch}
.simbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sim-state{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;border:1px solid var(--line)}
.sim-state.live{color:var(--ok);background:var(--ok-bg);border-color:var(--ok)}
.sim-state.paused{color:var(--back);background:var(--back-bg);border-color:var(--back)}
.sim-state .live-dot{width:8px;height:8px}
.sim-state.paused .live-dot{animation:none;background:var(--back);border-radius:2px}
.lbl-s{font-size:13px;font-weight:700;color:var(--text-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.segb{border:0;background:var(--surface);color:var(--text);padding:7px 12px;font-weight:700;font-size:14px;min-width:44px;border-radius:0}
.segb+.segb{border-left:1px solid var(--line)}
.segb:hover{background:var(--surface-2)}
.segb[aria-pressed="true"]{background:var(--accent-strong);color:var(--on-accent)}
.clock{background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;white-space:nowrap}

/* highlight on change: a short glow plus the "last change" text the pages keep */
@keyframes flashbg{0%{background-color:var(--tint);box-shadow:0 0 0 3px var(--accent)}100%{background-color:var(--flash-to,var(--surface));box-shadow:0 0 0 0 transparent}}
@keyframes flashsvg{0%{stroke:var(--focus);stroke-width:4}100%{stroke-width:0}}
.flash{animation:flashbg 1.9s ease-out}
.flash-svg{stroke:var(--focus);stroke-width:0;animation:flashsvg 1.9s ease-out}

/* Workers */
.wlayout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}
.wgrid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.wgrid > li{min-width:0}
.wcard{position:relative;height:100%;background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:9px;min-width:0}
.wcard:hover{border-color:var(--accent)}
.wcard.s-working{border-left:6px solid var(--ok)}
.wcard.s-waiting{border-left:6px dashed var(--wait)}
.wcard.s-idle{border-left:6px double var(--line)}
.wcard.s-lost{border:2px solid var(--risky);border-left-width:6px}
.wc-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.wc-id{display:flex;gap:10px;align-items:center;min-width:0}
.cliav{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--surface-3);color:var(--text);border:1px solid var(--line)}
.wc-id h3{font-size:14.5px;line-height:1.25;overflow-wrap:anywhere}
.wopen{border:0;background:none;padding:0;text-align:left;font-weight:700;color:var(--text);font-family:var(--mono);font-size:13.5px}
.wopen::after{content:"";position:absolute;inset:0;border-radius:16px}
.wopen:focus-visible{outline:none}
.wcard:has(.wopen:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.wc-cli{font-size:12.5px;color:var(--text-2);margin-top:1px}
.now{font-size:14px}
.now strong{color:var(--text)}
.elapsed{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text);font-weight:600}
.elapsed .ic{width:15px;height:15px;color:var(--accent)}
.wmeta{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:0}
.wmeta div{min-width:0}
.wmeta dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-2);font-weight:700}
.wmeta dd{margin:0;font-size:13.5px;font-weight:650}
.caps{display:flex;flex-wrap:wrap;gap:5px}
.c-none{color:var(--text-2);background:transparent;border:1px dashed var(--line)}
.c-alias{color:var(--text);background:var(--surface-2);border:1px solid var(--line);font-weight:650}
.mini-tl{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.mini-tl li{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;font-size:12.5px;align-items:baseline;padding-bottom:5px}
.mini-tl .tt{font-family:var(--mono);color:var(--text-2)}
.mini-tl .tb{position:absolute;left:52px;bottom:0;height:3px;border-radius:2px;background:var(--accent);opacity:.9}
.mini-h{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-2);font-weight:700}
.wc-act{margin-top:auto;padding-top:2px}
.wcard .btn{position:relative;z-index:2}
.wcard.s-lost .bar i,.wcard.s-idle .bar i{animation:none}

.qpanel{position:sticky;top:0;background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:14px 14px 10px}
.qpanel h2{font-size:18px;display:flex;gap:8px;align-items:center}
.qpanel h2 .count{font-size:13px;background:var(--surface-3);color:var(--text);border-radius:999px;padding:0 9px}
.qpanel h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-2);margin:14px 0 6px}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.qi{border-radius:12px;padding:9px 11px;font-size:13.5px;background:var(--surface-2);border:1px solid var(--line-soft);--flash-to:var(--surface-2)}
.qi-h{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qi-s{display:flex;gap:7px;align-items:flex-start;margin-top:5px;font-weight:600}
.qi-s .ic{flex:none;width:16px;height:16px;margin-top:3px}
.qi-n{margin-top:3px;font-size:12.5px;color:var(--text-2)}
.qi.q-ready{border-left:5px solid var(--ok)}
.qi.q-ready .qi-s .ic{color:var(--ok)}
.qi.q-busy{border-left:5px solid var(--back);background:var(--back-bg);--flash-to:var(--back-bg)}
.qi.q-busy .qi-s{color:var(--text)}
.qi.q-busy .qi-s .ic{color:var(--back)}
.qi.q-busy .qi-n{color:var(--text)}
.qi.q-appr{border:2px dashed var(--wait);background:var(--surface);--flash-to:var(--surface)}
.qi.q-appr .qi-s .ic{color:var(--wait)}
.qi-lnk{margin-top:4px;font-size:13px}
.qempty{font-size:13.5px;color:var(--text-2);padding:4px 2px}

.wdetail{position:fixed;top:64px;right:0;bottom:0;width:min(450px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:40;overflow:auto;padding:18px 20px 40px;transform:translateX(104%);visibility:hidden;transition:transform .25s,visibility 0s .25s}
.wdetail.open{transform:none;visibility:visible;transition:transform .25s}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dh h2{font-size:17px;overflow-wrap:anywhere}
.wdetail h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:20px 0 8px}
.dfacts{display:grid;gap:8px;margin:12px 0 0}
.dfacts div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;font-size:14px}
.dfacts dt{color:var(--text-2);font-weight:700;font-size:13px}
.dfacts dd{margin:0;font-weight:600}
.mx{width:100%;border-collapse:collapse;font-size:13px}
.mx th,.mx td{border:1px solid var(--line-soft);padding:5px 6px;text-align:center}
.mx th{background:var(--surface-2);color:var(--text);font-weight:700}
.mx td:first-child,.mx th:first-child{text-align:left}
.mx td .ic{width:15px;height:15px;color:var(--ok)}
.mx .no{color:var(--text-2)}
.mx caption{text-align:left;font-size:12.5px;color:var(--text-2);padding-bottom:5px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13.5px}
.steps li{background:var(--surface-2);border-radius:10px;padding:7px 10px;display:grid;gap:2px}
.steps .muted{font-size:12.5px}

/* Stats */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:13px 15px;min-width:0}
.t-l{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;color:var(--text-2)}
.t-v{font-size:34px;line-height:1.15;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.t-v small{font-size:16px;font-weight:700;color:var(--text-2);letter-spacing:0}
.t-s{font-size:13px;color:var(--text);margin-top:3px}
.t-s.muted{color:var(--text-2)}
.sgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.scard{background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:14px 16px 12px;min-width:0}
.scard h2{font-size:17px;letter-spacing:-.01em}
.scard .sub{font-size:13.5px;color:var(--text-2);margin:2px 0 10px}
.sp7{grid-column:span 7} .sp5{grid-column:span 5} .sp12{grid-column:span 12} .sp6{grid-column:span 6}
.chart{width:100%;min-width:0}
.chart svg{display:block;max-width:100%}
.ax{fill:var(--text-2);font:600 11.5px var(--sans)}
.ax-s{fill:var(--text);font:700 11.5px var(--sans)}
.lab{fill:var(--text);font:600 12.5px var(--sans)}
.lab-b{fill:var(--text);font:800 12.5px var(--sans)}
.grid-l{stroke:var(--line-soft);stroke-width:1}
.bar-a{fill:var(--accent)} .bar-t{fill:var(--land)} .track{fill:var(--surface-3)}
.line-3{fill:none;stroke:var(--s3);stroke-width:2.5;stroke-dasharray:6 4}
.s1{fill:var(--s1)} .s2{fill:var(--s2)} .s3{fill:var(--s3)} .s4{fill:var(--s4)} .s5{fill:var(--s5)} .s6{fill:var(--s6)}
.on-s{fill:var(--on-s);font:800 12px var(--sans)}
.legend{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:3px;font-size:13.5px}
.legend li{display:grid;grid-template-columns:20px 22px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:2px 4px;border-radius:8px;--flash-to:var(--surface)}
.legend .sw{width:16px;height:16px;border-radius:4px;display:inline-block}
.legend .num{font-weight:800;color:var(--text-2);font-size:12.5px}
.legend .val{font-weight:700;text-align:right}
.legend .pct{color:var(--text-2);width:44px;text-align:right}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--text);margin:0 0 6px}
.key span{display:inline-flex;gap:6px;align-items:center}
.key i{display:inline-block;width:16px;height:12px;border-radius:3px}
.key i.dash{height:0;border-top:3px dashed var(--s3);border-radius:0}
.stack1{display:flex;height:12px;border-radius:6px;overflow:hidden;margin-top:7px;background:var(--surface-3)}
.stack1 span{display:block;height:100%;border-right:2px solid var(--surface)}

/* ===== f0425: Talk, Tickets, Rafts, send back with a message, simulated terminal ===== */
a.lk{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}

function applySendBack(tid, stage, msg, lesson) {

    u.held = false; u.reworked = true; u.apprAt = 0; FROZEN.delete(tid);

}

  if (r.kind === "guess") { const g = $("#g-" + r.x); if (g) { g.scrollIntoView({ block: "center" }); } }
}
const defaultTk = () => ({ tab: "tickets", q: "", trib: "all", stage: "all", risk: "all", wait: "all", sort: "attention" });

/* ---------- events ---------- */
document.addEventListener("click", e => {
  if (talk && !e.target.closest("#pop") && !e.target.closest('[data-act="talk"]') && !e.target.closest('[data-act="sb-talk"]')) closeTalk(true);
  const row = e.target.closest(".trow");
  if (row) { const id = row.dataset.tid; select(id, false);
    if (window.matchMedia("(max-width:880px)").matches) { const m = $("#main"); if (m) m.focus({ preventScroll: true }); }
    else { const nr = $('[data-k="row-' + id + '"]'); if (nr) nr.focus({ preventScroll: true }); }
    return; }
  const b = e.target.closest("[data-act]");
  if (!b) { if (st.menu && !e.target.closest(".ctl")) { st.menu = false; renderTop(); } return; }
  const a = b.dataset.act, tid = st.sel;
  const closedMenu = a !== "menu" && st.menu; if (closedMenu) st.menu = false;
  switch (a) {
    case "nav": location.hash = "#/" + b.dataset.v; break;
    case "trib": st.filter = b.dataset.v; renderTop(); renderQueue(); break;
    case "theme": setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light"); renderTop(); break;
    case "menu": st.menu = !st.menu; renderTop(); if (st.menu) { const f = $(".ctl-menu button"); if (f) f.focus(); } break;
    case "ctl-reset": timers.forEach(clearTimeout); timers = []; st = fresh(); st.route = parseRoute(); st.view = st.route.view; initSim(); sim.sel = st.route.kind === "worker" ? st.route.id : null; closeTalk(true); $("#view").innerHTML = ""; render(); toast("Mockup reset.", "reset"); break;
    case "ctl-stack": if (st.view !== "approvals") { st.view = "approvals"; location.hash = "#/approvals"; $("#view").innerHTML = ""; } ctlStack(); break;
    case "ctl-empty": if (st.view !== "approvals") { st.view = "approvals"; location.hash = "#/approvals"; $("#view").innerHTML = ""; } ctlEmpty(); break;
    case "queue": st.qOpen = !st.qOpen; renderQueue(); renderScrim(); if (st.qOpen) { const r = $(".trow.sel") || $(".trow"); if (r) r.focus(); } break;
    case "scrim": st.qOpen = false; if (window.matchMedia("(max-width:1180px)").matches) st.chatOpen = false; renderView(); break;
    case "chat": st.chatOpen = !st.chatOpen; renderView(); break;
    case "g": goGuess(+b.dataset.i); break;
    case "prev": goGuess(st.gi[tid] - 1); break;
    case "next": goGuess(st.gi[tid] + 1); break;
    case "fine": {
      const gi = st.gi[tid]; st.rulings[tid][gi] = { s: "fine" }; st.form = null; renderMain();
      const rs = st.rulings[tid], nx = rs.findIndex((r, i) => i > gi && r.s === "none"), any = nx >= 0 ? nx : rs.findIndex(r => r.s === "none");
      if (any >= 0) later(() => { if (st.sel === tid && st.gi[tid] === gi) goGuess(any); }, ms(420));
      else { const ap = $('[data-act="approve"]:not([disabled])'); if (ap) ap.focus(); }
      break; }
    case "change": { const g = G(tid)[st.gi[tid]], r = st.rulings[tid][st.gi[tid]];
      st.form = r.s === "change" ? { opt: r.opt, text: r.text || "", stage: r.stage, note: r.note || "" } : { opt: "0", text: "", stage: g.stage, note: "" };
      renderMain(); const f = $('.cform input[name="copt"]:checked'); if (f) f.focus(); break; }
    case "cancel": st.form = null; renderMain(); { const c = $('[data-act="change"]'); if (c) c.focus(); } break;
    case "undo": st.rulings[tid][st.gi[tid]] = { s: "none" }; renderMain(); break;
    case "ask": st.chatOpen = true; if (!st.draft) st.draft = "About guess " + (st.gi[tid] + 1) + ": "; renderView();
      { const ta = $("#chat-in"); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } } break;
    case "approve": openApprove(tid); break;
    case "yes-approve": doApprove(tid); break;
    case "sendback": openSendBack(tid); break;
    case "sb-ticket": openSendBack(b.dataset.id); break;
    case "sb-talk": openTalk(ref("ticket", st.sb.tid), "", b); break;
    case "talk": openTalk(parseRef(b.dataset.ref), b.dataset.opt || "", b); break;
    case "pop-close": closeTalk(); break;
    case "copy": copyText(b.dataset.text, b); break;
    case "term-open": openTerm(); break;
    case "term-close": closeTerm(); break;
    case "tk-tab": location.hash = b.dataset.v === "rafts" ? "#/tickets/rafts" : "#/tickets"; break;
    case "tk-clear": st.tk = defaultTk(); st.sig = ""; renderView(); break;
    case "stat-range": st.range[b.dataset.key] = b.dataset.v; st.sig = ""; renderStatPage(); break;
    case "close": closeModal(); break;
    case "pic": modal('<h2 id="mt">Your picture</h2><div class="big">' + sketchSvg() + '</div><p class="muted">' + esc(T[tid].readAs) + '</p><div class="mactions"><button class="btn primary" data-act="close">Close</button></div>', true); break;
    case "mock": modal('<h2 id="mt">Mockup: the banded board</h2><div class="big">' + wireSvg() + '</div><p class="muted">Made-up data. The real board would show each chip\'s ticket id and tributary name.</p><div class="mactions"><button class="btn primary" data-act="close">Close</button></div>', true); break;
    default: simAct(a, b);
  }
  if (closedMenu && a !== "nav" && a !== "ctl-reset" && a !== "ctl-stack" && a !== "ctl-empty" && a !== "theme") renderTop();
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "chat-in") { st.draft = el.value; return; }
  if (el.dataset.tkf) { st.tk[el.dataset.tkf] = el.value; st.sig = ""; renderList(true); return; }
  if (el.dataset.cli) { st.cli = el.value; saveCli(el.value); return; }
  if (el.dataset.sbf && st.sb) {
    if (el.dataset.sbf === "msg") { st.sb.msg = el.value; if (el.value.trim()) { el.removeAttribute("aria-invalid"); const er = $("#sb-err"); if (er) er.hidden = true; } }
    else if (el.dataset.sbf === "lesson") st.sb.lesson = el.checked;
    return;
  }
  if (el.name === "sbstage" && st.sb) { st.sb.stage = el.value; renderSB(true); const f = $('[data-k="sbs-' + el.value + '"]'); if (f) f.focus(); return; }
  if (el.closest(".cform") && st.form) {
    if (el.name === "ctext") { st.form.text = el.value; if (el.value && st.form.opt !== "other") { st.form.opt = "other"; const o = $('input[value="other"]'); if (o) o.checked = true; } }
    else if (el.name === "cnote") st.form.note = el.value;
    else if (el.name === "copt") st.form.opt = el.value;
    else if (el.name === "cstage") { st.form.stage = el.value; renderMain(); }
  }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === "chat") sendChat();
  if (f === "sendback" && st.sb) { submitSendBack(); return; }
  if (f === "change" && st.form) { const tid = st.sel; st.rulings[tid][st.gi[tid]] = { s: "change", opt: st.form.opt, text: st.form.text, stage: st.form.stage, note: st.form.note }; st.form = null; renderMain(); const c = $('[data-act="sendback"]'); if (c && !c.disabled) c.focus(); }
});
document.addEventListener("keydown", e => {
  if (talk) {
    if (e.key === "Escape") { e.preventDefault(); closeTalk(); return; }
    if (e.key === "Tab") { const f = $$("button,select", $("#pop")); if (f.length) { const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } } return; }
  }
  if (e.key === "Escape" && termOpen()) { closeTerm(); return; }
  const w = $("#modal");
  if (!w.hidden) {
    if (e.key === "Escape") { closeModal(); return; }
    if (e.key === "Tab") { const f = $$("button,textarea,input", w); if (!f.length) return; const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
    return;
  }
  if (e.key === "Escape" && st.view === "workers" && sim.sel) { simAct("wclose"); return; }
  if (e.key === "Escape") { if (st.menu) { st.menu = false; renderTop(); $('[data-act="menu"]').focus(); } else if (st.qOpen || (st.chatOpen && window.matchMedia("(max-width:1180px)").matches)) { st.qOpen = false; if (window.matchMedia("(max-width:1180px)").matches) st.chatOpen = false; renderView(); } return; }
  if (e.target.id === "chat-in" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); return; }
  const row = e.target.closest && e.target.closest(".trow");
  if (row && (e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "Home" || e.key === "End")) {
    e.preventDefault(); const rows = $$("#queue .trow"), i = rows.indexOf(row);
    const j = e.key === "Home" ? 0 : e.key === "End" ? rows.length - 1 : Math.max(0, Math.min(rows.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)));
    rows[j].focus(); rows[j].scrollIntoView({ block: "nearest" });
  }
});
window.addEventListener("resize", () => { if (st.view === "approvals") renderScrim(); else { st.sig = ""; renderSim(); } if (talk) placePop(); });
document.addEventListener("scroll", () => { if (talk) placePop(); }, true);
window.addEventListener("hashchange", applyRoute);

/* ---------- start ---------- */
st = fresh(); st.route = parseRoute(); st.view = st.route.view; initSim(); sim.sel = st.route.kind === "worker" ? st.route.id : null; if (st.view === "approvals" && st.route.id && T[st.route.id]) st.sel = st.route.id;
try { const t = localStorage.getItem("f0425-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) { /* storage may be blocked */ }
render();
setInterval(simTick, 500);
</script>
